services:
  # =========================================================================
  # Core Infrastructure Databases & Message Brokers
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: duangdee-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-multiple-db.sh:/docker-entrypoint-initdb.d/init-multiple-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: duangdee-redis
    command: redis-server --requirepass redissecret
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redissecret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: duangdee-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

  # =========================================================================
  # API Gateway
  # =========================================================================
  kong:
    image: kong:3.6.1
    container_name: duangdee-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000" # HTTP Gateway Proxy Entrypoint
      - "8001:8001" # Kong Admin API
    volumes:
      - ./config/kong.yml:/kong/kong.yml

  # =========================================================================
  # Observability Stack (ElasticSearch, Kibana & Fluentbit)
  # =========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: duangdee-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch-setup:
    image: curlimages/curl:8.5.0
    container_name: duangdee-elasticsearch-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./config/ecs-index-template.json:/config/ecs-index-template.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        curl -sf -X PUT "http://elasticsearch:9200/_index_template/duangdee-logs" \
          -H "Content-Type: application/json" \
          -d @/config/ecs-index-template.json
        echo "ECS index template applied"
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: duangdee-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  fluentbit:
    image: fluent/fluent-bit:3.0
    container_name: duangdee-fluentbit
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./config/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./config/parsers.conf:/fluent-bit/etc/parsers.conf
      - ./config/ecs_map.lua:/fluent-bit/etc/ecs_map.lua
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully

  # =========================================================================
  # Go Microservices
  # =========================================================================
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    ports:
      - "8081:8080"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: auth-service
    environment:
      - PORT=8080
      - DB_SOURCE=postgres://postgres:secretpassword@postgres:5432/auth_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fluentbit:
        condition: service_started

  tarot-service:
    build:
      context: .
      dockerfile: services/tarot/Dockerfile
    container_name: tarot-service
    ports:
      - "8082:8080"
    volumes:
      - ./assets/cards:/assets/cards:ro
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: tarot-service
    environment:
      - PORT=8080
      - DB_SOURCE=postgres://postgres:secretpassword@postgres:5432/tarot_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - ASSETS_DIR=/assets/cards
    depends_on:
      postgres:
        condition: service_healthy
      fluentbit:
        condition: service_started

  reading-service:
    build:
      context: .
      dockerfile: services/reading/Dockerfile
    container_name: reading-service
    ports:
      - "8083:8080"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: reading-service
    environment:
      - PORT=8080
      - DB_SOURCE=postgres://postgres:secretpassword@postgres:5432/reading_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      fluentbit:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: payment-service
    ports:
      - "8084:8080"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: payment-service
    environment:
      - PORT=8080
      - DB_SOURCE=postgres://postgres:secretpassword@postgres:5432/payment_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      fluentbit:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: notification-service
    ports:
      - "8085:8080"
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        tag: notification-service
    environment:
      - PORT=8080
      - DB_SOURCE=postgres://postgres:secretpassword@postgres:5432/notification_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      fluentbit:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  es_data:
